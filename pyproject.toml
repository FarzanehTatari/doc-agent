[project]
name = "doc-agent"
version = "0.4.1"
description = "AI-powered documentation for Simulink control models."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Farzaneh" }]
keywords = ["simulink", "documentation", "llm", "anthropic", "claude"]

dependencies = [
    "anthropic>=0.39.0",
    "pydantic>=2.5",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "rich>=13.7",
    "typer>=0.12",
    # --- Phase 3 — RAG ----------------------------------------------
    "chromadb>=0.5",      # local persistent vector store + ONNX embedder
    "pypdf>=4.0",         # PDF text extraction
    "python-docx>=1.1",   # DOCX text extraction
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
doc-agent = "doc_agent.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/doc_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra -q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]
